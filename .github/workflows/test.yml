name: Run K.select tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run K.select tests
        run: |
          cd kernel
          python tests/test_k_select.py
      - name: Run Auditor tests
        run: |
          cd kernel
          python tests/test_auditor.py