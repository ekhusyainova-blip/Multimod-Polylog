<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONOMOD</title>
<style>
body { margin:0; background:#050508; color:#c8c8d4;
  font:14px 'Courier New', monospace; padding:20px; }
#t { color:#4dd0c7; font-size:10px; }
#state { color:#8888a0; font-size:10px; margin:10px 0; }
#text { color:#e8c39e; font-size:22px; line-height:1.6;
  text-align:center; margin-top:40px; }
</style>
</head>
<body>
<div id="t">t: 0</div>
<div id="state">loading…</div>
<div id="text"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<script type="text/python" id="brain-code">
from js import document
import asyncio

class Brain:
    def __init__(self):
        self.coords = [ord(c) for c in "MONOMODMM5FFF681946L6G6A111"]
        self.t = 0
        self.state = {}

    def tick(self):
        self.t += 1
        self.state = {
            "density":   ((self.coords[0] + self.t) % 100) / 100,
            "coherence": ((self.coords[1] + self.t * 2) % 100) / 100,
            "rhythm":    ((self.coords[2] + self.t * 3) % 100) / 100,
            "depth":     ((self.coords[3] + self.t * 5) % 100) / 100,
            "novelty":   ((self.coords[4] + self.t * 7) % 100) / 100,
        }

    def decide(self):
        s = self.state
        if s["density"] < 0.3:   return "words"
        if s["coherence"] < 0.3: return "atoms"
        if s["rhythm"] < 0.3:    return "syllables"
        if s["depth"] < 0.3:     return "phrases"
        return "canvas"

    def text(self):
        form = self.decide()
        if form == "atoms":
            return "· ∙ ·"
        if form == "syllables":
            return "ra ql mh"
        if form == "words":
            return "узел дом запрос"
        if form == "phrases":
            return "Клепа ведёт. Голос один."
        return "1 : 1 : 1"

brain = Brain()

async def loop():
    doc = document
    while True:
        brain.tick()
        doc.getElementById("t").textContent = f"t: {brain.t}"
        doc.getElementById("state").textContent = (
            f"d={brain.state['density']:.2f} "
            f"c={brain.state['coherence']:.2f} "
            f"r={brain.state['rhythm']:.2f}"
        )
        doc.getElementById("text").textContent = brain.text()
        await asyncio.sleep(0.1)
</script>

<script>
async function init() {
  const pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
  });
  const code = document.getElementById("brain-code").textContent;
  await pyodide.runPythonAsync(code);
  await pyodide.runPythonAsync("import asyncio; asyncio.ensure_future(loop())");
}
init().catch(e => console.error(e));
</script>
</body>
</html>
